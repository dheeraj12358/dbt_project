version: 2

snapshots:
  - name: dim_customers
    description: "Slowly changing Dimension (SCD) snapshot of customers from raw_customers"
    meta:
      owner: "CRM Data Team"
      owner_email: "crm-team@gmail.com"
      domain: "customers"

    columns:
      - name: dbt_scd_id
        description:  "Unique identifier for each version of a customer row"
        tests:
          - not_null
          - unique
      
      - name: customer_id
        description: "Business key for the customer"
        tests:
          - not_null
      

      - name: customer_name
        description: "Full name of the customer"
        tests:
          - not_null

      - name: city
        description: "Customer city"
        tests:
          - not_null

      - name: updated_at
        description: "Timestamp used by the snapshot to detect changes"
